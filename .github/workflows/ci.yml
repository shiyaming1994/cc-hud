name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
        env:
          # 额度条的重置时刻测试按北京时间写死，runner 默认 UTC 会整体差 8 小时
          TZ: Asia/Shanghai
